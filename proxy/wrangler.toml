name = "tt-alarm-proxy"
main = "worker.js"
compatibility_date = "2025-09-01"

[vars]
# Comma-separated list of sites allowed to call the proxy, e.g. "https://straffd.github.io".
# Leave empty to allow any site (not recommended once it's live).
ALLOWED_ORIGINS = ""
GEMINI_MODEL = "gemini-2.5-flash"

# Max 10 requests per 60 s per visitor IP.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }
